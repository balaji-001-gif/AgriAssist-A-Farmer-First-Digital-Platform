{% extends "templates/web.html" %}

{% block title %}Ask Synth - AI Agronomist{% endblock %}

{% block page_content %}
<style>
    .synth-container {
        padding: 30px 20px;
        max-width: 700px;
        margin: auto;
    }

    .ai-box {
        background: #ffffff;
        border-radius: 16px;
        padding: 30px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .ai-box h2 { color: #2ecc71; margin: 0 0 8px 0; }
    .ai-box > p { color: #636e72; font-size: 14px; margin: 0 0 20px 0; }

    .btn-upload {
        border: 2px dashed #ccc;
        color: #999;
        background: transparent;
        padding: 30px;
        border-radius: 10px;
        font-size: 14px;
        width: 100%;
        cursor: pointer;
        transition: all 0.3s;
        margin-bottom: 15px;
    }

    .btn-upload:hover { border-color: #2ecc71; color: #2ecc71; }

    #query-input {
        width: 100%;
        background: #f8f9fa;
        border: 1px solid #e0e0e0;
        color: #2d3436;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 15px;
        font-size: 14px;
        resize: vertical;
        min-height: 80px;
    }

    .btn-diagnose {
        background: #2ecc71;
        border: none;
        width: 100%;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        transition: background 0.2s;
    }

    .btn-diagnose:hover { background: #27ae60; }

    .response-area {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
        display: none;
        border: 1px solid #e0e0e0;
    }

    .response-area strong { color: #2ecc71; display: block; margin-bottom: 10px; }

    .loading-bar {
        height: 14px;
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 6px;
        margin-bottom: 8px;
    }

    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }
</style>

<div class="synth-container">
    <div class="ai-box">
        <h2>🌿 Ask Synth</h2>
        <p>Your AI-powered agronomic expert. Upload a photo or describe the issue.</p>

        <button class="btn-upload" onclick="document.getElementById('file-input').click()">
            📷 Click to upload Crop Photo
        </button>
        <input type="file" id="file-input" style="display:none" accept="image/*" onchange="handleFile(this)">
        <div id="file-name" style="font-size: 13px; color: #636e72; margin-bottom: 10px; display: none;"></div>

        <textarea id="query-input" placeholder="Describe the symptoms or ask a question (e.g., 'yellow spots on rice leaves')..."></textarea>

        <button class="btn-diagnose" id="ask-btn" onclick="askAI()">Get Diagnosis</button>

        <div id="ai-response" class="response-area">
            <strong>Synth's Analysis:</strong>
            <div id="response-text"></div>
        </div>
    </div>
</div>

<script>
    function askAI() {
        var query = document.getElementById('query-input').value;
        var responseArea = document.getElementById('ai-response');
        var responseText = document.getElementById('response-text');

        if (!query) {
            frappe.msgprint("Please enter a query or describe the issue.");
            return;
        }

        responseArea.style.display = 'block';
        responseText.innerHTML = '<div class="loading-bar" style="width:100%"></div><div class="loading-bar" style="width:75%"></div>';

        frappe.call({
            method: "agri_assist.api.ask_synth",
            args: { query: query },
            callback: function(r) {
                if (r.message && r.message.status === 'success') {
                    responseText.innerHTML = '<p style="color: #2d3436; line-height: 1.6;">' + r.message.response + '</p>';
                } else {
                    responseText.innerHTML = '<p style="color: #e74c3c;">Could not get a response. Please try again.</p>';
                }
            },
            error: function() {
                responseText.innerHTML = '<p style="color: #e74c3c;">Connection error. Please check your internet and try again.</p>';
            }
        });
    }

    function handleFile(input) {
        if (input.files && input.files[0]) {
            var el = document.getElementById('file-name');
            el.style.display = 'block';
            el.innerText = '📎 Selected: ' + input.files[0].name;
        }
    }
</script>
{% endblock %}
