{% extends "templates/web.html" %}

{% block style %}
<style>
    .market-container {
        padding: 40px 20px;
        max-width: 1200px;
        margin: auto;
    }

    .filter-bar {
        background-color: #2d2d2d;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 30px;
        display: flex;
        gap: 15px;
        overflow-x: auto;
    }

    .filter-chip {
        padding: 8px 20px;
        border-radius: 20px;
        background: #1a1a1a;
        color: #888;
        cursor: pointer;
        white-space: nowrap;
        border: 1px solid #444;
    }

    .filter-chip.active {
        background: #2ecc71;
        color: white;
        border-color: #2ecc71;
    }

    .market-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 25px;
    }

    .product-card {
        background: #2d2d2d;
        border-radius: 15px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.05);
        transition: all 0.3s;
    }

    .product-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .product-image {
        width: 100%;
        height: 180px;
        background: #3d3d3d;
        object-fit: cover;
    }

    .product-info {
        padding: 20px;
    }

    .price-tag {
        color: #2ecc71;
        font-size: 20px;
        font-weight: bold;
    }
</style>
{% endblock %}

{% block content %}
<div class="market-container">
    <h1 style="margin-bottom: 30px;">Agri Marketplace</h1>

    <div class="filter-bar">
        <div class="filter-chip active">All</div>
        <div class="filter-chip">Seeds</div>
        <div class="filter-chip">Fertilizers</div>
        <div class="filter-chip">Equipment</div>
        <div class="filter-chip">Produce</div>
    </div>

    <div class="market-grid">
        <!-- Mock Data for visual demonstration -->
        <div class="product-card">
            <div class="product-image" style="background: url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60') center; background-size: cover;"></div>
            <div class="product-info">
                <span style="color: #888; font-size: 12px; text-transform: uppercase;">Seeds</span>
                <h3 style="margin: 5px 0 15px 0;">Premium Wheat Seeds</h3>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="price-tag">₹450/kg</span>
                    <button class="btn-primary" style="padding: 5px 15px;">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="product-card">
            <div class="product-image" style="background: url('https://images.unsplash.com/photo-1586771107445-d3ca888129ff?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60') center; background-size: cover;"></div>
            <div class="product-info">
                <span style="color: #888; font-size: 12px; text-transform: uppercase;">Fertilizers</span>
                <h3 style="margin: 5px 0 15px 0;">Organic Compost (50kg)</h3>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="price-tag">₹1,200</span>
                    <button class="btn-primary" style="padding: 5px 15px;">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
