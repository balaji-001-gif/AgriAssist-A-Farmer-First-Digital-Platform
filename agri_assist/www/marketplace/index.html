{% extends "templates/web.html" %}

{% block title %}Agri Marketplace{% endblock %}

{% block page_content %}
<style>
    .market-container {
        padding: 30px 20px;
        max-width: 1200px;
        margin: auto;
    }

    .market-container h1 { margin-bottom: 20px; color: #2d3436; }

    .filter-bar {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        margin-bottom: 25px;
        padding-bottom: 5px;
    }

    .filter-chip {
        padding: 8px 20px;
        border-radius: 20px;
        background: #f0f0f0;
        color: #636e72;
        cursor: pointer;
        white-space: nowrap;
        border: 1px solid #e0e0e0;
        font-size: 14px;
        transition: all 0.2s;
    }

    .filter-chip:hover { border-color: #2ecc71; color: #2ecc71; }
    .filter-chip.active { background: #2ecc71; color: white; border-color: #2ecc71; }

    .market-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
    }

    .product-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e0e0e0;
        transition: all 0.3s;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.12); }

    .product-image {
        width: 100%;
        height: 180px;
        background: #f5f5f5;
        object-fit: cover;
    }

    .product-info { padding: 16px; }
    .product-info .category { color: #999; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    .product-info h3 { margin: 5px 0 12px 0; font-size: 16px; color: #2d3436; }

    .product-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .price-tag { color: #2ecc71; font-size: 18px; font-weight: bold; }

    .btn-cart {
        background: #2ecc71;
        border: none;
        padding: 6px 14px;
        border-radius: 6px;
        color: white;
        font-size: 13px;
        cursor: pointer;
        font-weight: 600;
    }

    .btn-cart:hover { background: #27ae60; }

    .empty-state {
        text-align: center; padding: 40px; color: #999; grid-column: 1 / -1;
    }
</style>

<div class="market-container">
    <h1>🛒 Agri Marketplace</h1>

    <div class="filter-bar">
        <div class="filter-chip active" onclick="filterItems('All', this)">All</div>
        <div class="filter-chip" onclick="filterItems('Seeds', this)">Seeds</div>
        <div class="filter-chip" onclick="filterItems('Fertilizers', this)">Fertilizers</div>
        <div class="filter-chip" onclick="filterItems('Pesticides', this)">Pesticides</div>
        <div class="filter-chip" onclick="filterItems('Equipment', this)">Equipment</div>
        <div class="filter-chip" onclick="filterItems('Produce', this)">Produce</div>
    </div>

    <div class="market-grid" id="product-grid">
        <div class="empty-state">Loading...</div>
    </div>
</div>

<script>
    var allItems = [];

    frappe.ready(function() {
        loadItems();
    });

    function loadItems(category) {
        var filters = {};
        if (category && category !== 'All') {
            filters.category = category;
        }
        frappe.call({
            method: "frappe.client.get_list",
            args: {
                doctype: "Agri Marketplace Item",
                fields: ["name", "item_name", "category", "price", "image", "description", "stock_qty"],
                filters: filters,
                limit_page_length: 20,
                order_by: "modified desc"
            },
            callback: function(r) {
                allItems = r.message || [];
                renderItems(allItems);
            },
            error: function() {
                document.getElementById('product-grid').innerHTML = '<div class="empty-state">Could not load items.</div>';
            }
        });
    }

    function renderItems(items) {
        var grid = document.getElementById('product-grid');
        if (!items.length) {
            grid.innerHTML = '<div class="empty-state">No items found. Add items via Frappe Desk → Agri Marketplace Item.</div>';
            return;
        }
        var html = '';
        items.forEach(function(item) {
            var imgStyle = item.image
                ? 'background-image: url(' + item.image + '); background-size: cover; background-position: center;'
                : 'background: linear-gradient(135deg, #d5f5e3, #a3e4d7); display: flex; align-items: center; justify-content: center; font-size: 40px;';
            var imgContent = item.image ? '' : '🌱';

            html += '<div class="product-card" data-category="' + item.category + '">'
                + '<div class="product-image" style="' + imgStyle + '">' + imgContent + '</div>'
                + '<div class="product-info">'
                + '<span class="category">' + (item.category || '') + '</span>'
                + '<h3>' + item.item_name + '</h3>'
                + '<div class="product-footer">'
                + '<span class="price-tag">₹' + (item.price || 0) + '</span>'
                + '<a href="/app/agri-marketplace-item/' + item.name + '" class="btn-cart">View Details</a>'
                + '</div></div></div>';
        });
        grid.innerHTML = html;
    }

    function filterItems(category, el) {
        document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
        el.classList.add('active');
        loadItems(category);
    }
</script>
{% endblock %}
